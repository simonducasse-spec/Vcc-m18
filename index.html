<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Système de Jeu — M18 🏐</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d1b2a;
    --blue: #1a3c5e;
    --accent: #e8b84b;
    --light: #f4f6f9;
    --muted: #8a9ab5;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy);
    color: var(--light);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
    padding: 24px 20px 20px;
    position: relative; overflow: hidden;
  }
  .header::before {
    content: '🏐'; position: absolute; right: -10px; top: -10px;
    font-size: 100px; opacity: 0.07; transform: rotate(-15deg);
  }
  .header-badge {
    display: inline-block; background: var(--accent); color: var(--navy);
    font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    padding: 4px 10px; border-radius: 20px; margin-bottom: 8px;
  }
  .header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 38px; letter-spacing: 2px; line-height: 1; margin-bottom: 4px; }
  .header p { font-size: 13px; color: var(--muted); }

  main { padding: 20px 16px 40px; }

  .section-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2px;
    margin: 6px 0 12px; color: var(--accent);
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: rgba(232,184,75,0.2); }

  .schema {
    border-radius: var(--radius); overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    margin-bottom: 22px;
  }
  .schema img { width: 100%; height: auto; display: block; aspect-ratio: 1094 / 975; }

  .controls {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius);
    padding: 14px; margin-bottom: 14px;
  }
  .label {
    font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px;
  }
  .label + .row { margin-bottom: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row:last-child { margin-bottom: 0; }

  .btn {
    flex: 1; min-width: 0;
    padding: 12px 6px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
    line-height: 1.25; text-align: center; cursor: pointer;
    transition: border-color .2s, color .2s, background .2s;
  }
  .btn:hover { border-color: rgba(232,184,75,0.4); color: var(--light); }
  .btn.active { border-color: var(--accent); background: rgba(232,184,75,0.12); color: var(--accent); }
  .btn.pos { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; padding: 8px 0; }

  .schema-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; text-align: center; margin-bottom: 2px; }
  .schema-subtitle { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 12px; }
  .poste-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .poste { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 4px; font-size: 12px; }
  .poste .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .poste.tous { grid-column: span 1; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">

<div class="header">
  <div class="header-badge">Saison 2026–2027</div>
  <h1>Système de Jeu M18</h1>
  <p>5-1 · Défense prioritaire · Brésil × Italie</p>
</div>

<main>
  <!-- 1. LÉGENDE + MON POSTE -->
  <div class="section-title">Légende</div>
  <div class="schema" style="margin-bottom:12px;">
    <img id="legendImg" src="images/legende.jpg" alt="Légende : R4 Avant (bleu), Centrale (vert), Passeuse (orange), Libéro (rouge), Pointue (jaune), R4 Arrière (violet)">
  </div>
  <div class="controls" style="margin-bottom:22px;">
    <div class="label">Mon poste</div>
    <div class="poste-row" id="posteRow"></div>
    <div class="hint">Ton poste ressort en surbrillance sur tous les schémas.</div>
  </div>

  <!-- 2. SCHÉMAS -->
  <div class="section-title">Système de jeu</div>

  <div class="controls">
    <div class="label">Phase</div>
    <div class="row" id="phaseRow">
      <button class="btn active" data-phase="reception">Réception</button>
      <button class="btn" data-phase="defense">Défense</button>
    </div>

    <div class="label" id="subLabel">Rotation</div>
    <div class="row" id="subRow"></div>
  </div>

  <div class="schema-title" id="schemaTitle"></div>
  <div class="schema-subtitle" id="schemaSubtitle"></div>
  <div class="schema">
    <img id="schemaImg" src="" alt="">
  </div>
</main>

</div>

<script>
  // Schémas — pour en ajouter : déposer l'image dans images/ et ajouter une ligne ici
  const PHASES = {
    reception: {
      label: 'Rotation',
      items: [
        { id: 'p1', btn: 'P1', title: 'P1 — Réception', sub: 'Passeuse en zone 1', img: 'images/reception-p1.jpg' },
        { id: 'p2', btn: 'P2', title: 'P2 — Réception', sub: 'Passeuse en zone 2', img: 'images/reception-p2.jpg' },
        { id: 'p3', btn: 'P3', title: 'P3 — Réception', sub: 'Passeuse en zone 3', img: 'images/reception-p3.jpg' },
        { id: 'p4', btn: 'P4', title: 'P4 — Réception', sub: 'Passeuse en zone 4', img: 'images/reception-p4.jpg' },
        { id: 'p5', btn: 'P5', title: 'P5 — Réception', sub: 'Passeuse en zone 5', img: 'images/reception-p5.jpg' },
        { id: 'p6', btn: 'P6', title: 'P6 — Réception', sub: 'Passeuse en zone 6', img: 'images/reception-p6.jpg' },
      ]
    },
    defense: {
      label: 'Situation',
      items: [
        { id: 'base',  btn: 'Base<br>passeuse avant', title: 'Défense — Position de base', sub: 'Passeuse à l’avant, avant l’attaque adverse', img: 'images/defense-base-passeuse-avant.jpg' },
        { id: 'att2',  btn: 'Attaque<br>adverse en 2', title: 'Défense — Attaque adverse en 2', sub: 'L\u2019adversaire attaque depuis sa zone 2', img: 'images/defense-attaque-2.jpg' },
        { id: 'att4',  btn: 'Attaque<br>adverse en 4', title: 'Défense — Attaque adverse en 4', sub: 'L\u2019adversaire attaque depuis sa zone 4', img: 'images/defense-attaque-4.jpg' },
      ]
    }
  };

  const POSTES = [
    { id: '',           label: 'Tous',        color: null },
    { id: 'passeuse',   label: 'Passeuse',    color: '#f08a24' },
    { id: 'pointue',    label: 'Pointue',     color: '#f2d22e' },
    { id: 'centrale',   label: 'Centrale',    color: '#3cc24a' },
    { id: 'r4-avant',   label: 'R4 Avant',    color: '#2f8fe0' },
    { id: 'r4-arriere', label: 'R4 Arrière',  color: '#9b45d6' },
    { id: 'libero',     label: 'Libéro',      color: '#e53935' },
  ];
  // Poste : lien direct (?poste=centrale), sinon dernier choix sur ce téléphone
  let poste = new URLSearchParams(location.search).get('poste') || '';
  if (!poste) { try { poste = localStorage.getItem('vcc-poste') || ''; } catch (e) {} }
  if (!POSTES.some(p => p.id === poste)) poste = '';

  const src = base => poste ? base.replace('.jpg', '--' + poste + '.jpg') : base;

  function renderPostes() {
    document.getElementById('posteRow').innerHTML = POSTES.map(p =>
      `<button class="btn poste ${p.id === poste ? 'active' : ''}" data-poste="${p.id}">` +
      (p.color ? `<span class="dot" style="background:${p.color}"></span>` : '') + p.label + `</button>`
    ).join('');
    document.getElementById('legendImg').src = src('images/legende.jpg');
  }
  document.getElementById('posteRow').addEventListener('click', e => {
    const b = e.target.closest('.btn'); if (!b) return;
    poste = b.dataset.poste;
    try { localStorage.setItem('vcc-poste', poste); } catch (e) {}
    renderPostes(); render(); preload();
  });

  let phase = 'reception';
  let current = { reception: 'p1', defense: 'base' };

  // Précharge les schémas du poste choisi pour un changement instantané
  function preload() { Object.values(PHASES).forEach(p => p.items.forEach(i => { const im = new Image(); im.src = src(i.img); })); }

  function render() {
    const p = PHASES[phase];
    document.querySelectorAll('#phaseRow .btn').forEach(b => b.classList.toggle('active', b.dataset.phase === phase));
    document.getElementById('subLabel').textContent = p.label;
    const row = document.getElementById('subRow');
    row.innerHTML = p.items.map(i =>
      `<button class="btn ${phase === 'reception' ? 'pos' : ''} ${i.id === current[phase] ? 'active' : ''}" data-id="${i.id}">${i.btn}</button>`
    ).join('');
    const item = p.items.find(i => i.id === current[phase]);
    document.getElementById('schemaTitle').textContent = item.title;
    document.getElementById('schemaSubtitle').textContent = item.sub;
    const img = document.getElementById('schemaImg');
    img.src = src(item.img);
    img.alt = item.title;
  }

  document.getElementById('phaseRow').addEventListener('click', e => {
    const b = e.target.closest('.btn'); if (!b) return;
    phase = b.dataset.phase; render();
  });
  document.getElementById('subRow').addEventListener('click', e => {
    const b = e.target.closest('.btn'); if (!b) return;
    current[phase] = b.dataset.id; render();
  });

  renderPostes(); render(); preload();
</script>
</body>
</html>
